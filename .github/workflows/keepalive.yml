name: Mantener Supabase activo

# El plan gratis de Supabase pausa los proyectos sin actividad por ~7 días.
# Este workflow hace una consulta liviana a la base todos los días.
# Si falla (por ejemplo, porque el proyecto ya está pausado), GitHub te avisa por mail.

on:
  schedule:
    - cron: "17 12 * * *" # todos los días, 9:17 hora de Argentina
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # Valores públicos por diseño (los mismos que usa la app en el navegador).
      SUPABASE_URL: https://yzowhmorsfqccvdfsxzo.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6b3dobW9yc2ZxY2N2ZGZzeHpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5OTUxNjMsImV4cCI6MjEwNzU3MTE2M30.YjpraTVtxviYildG0_usRV6lpUqT9dd_ynwNY8nIiXE
    steps:
      - name: Consultar la base
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" --retry 3 --retry-delay 10 --max-time 30 \
            "$SUPABASE_URL/rest/v1/run_days?select=day&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" || true)
          echo "Respuesta de Supabase: HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase no respondió bien (HTTP $status). ¿El proyecto está pausado? Restauralo desde https://supabase.com/dashboard"
            exit 1
          fi
